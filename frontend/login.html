<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #e5e6ef;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777d98;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #dfe1eb;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #6654e8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .switch a {
            color: #6654e8;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="auth-box">

        <h1 id="formTitle">Create Account</h1>

        <p class="subtitle" id="formSubtitle">
            Register to manage your tasks
        </p>

        <form id="authForm">

            <input
                type="text"
                id="name"
                placeholder="Full name"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" id="submitBtn">
                Register
            </button>

        </form>

        <p id="message"></p>

        <div class="switch">
            <span id="switchText">Already have an account?</span>
            <a onclick="toggleForm()" id="switchLink">Login</a>
        </div>

    </div>

    <script src="auth.js"></script>

</body>

</html>
